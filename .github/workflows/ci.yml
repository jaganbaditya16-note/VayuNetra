name: VayuNetra CI

on:
  push:
    branches: ["main", "c4c-hardening"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint diagnostics
        continue-on-error: true
        run: set -o pipefail; npm run lint 2>&1 | tee lint-output.txt
      - name: Upload lint log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vayunetra-lint-last
          path: lint-output.txt
