name: VayuNetra CI

on:
  push:
    branches: ["main", "c4c-hardening"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint 2>&1 | tee lint-output.txt
      - name: Production build
        id: build
        run: npm run build 2>&1 | tee build-output.txt
      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vayunetra-ci-logs
          path: |
            lint-output.txt
            build-output.txt
          if-no-files-found: ignore
      - name: Fail if lint failed
        if: steps.lint.outcome == 'failure'
        run: exit 1
